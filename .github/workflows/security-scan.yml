name: Security Scan

# PR-only by design: TruffleHog diffs against the default branch, so on a push
# to main it scans ~nothing — the PR run is the meaningful one.
on:
  pull_request:
    branches:
      - dev
      - main
    paths-ignore:
      - 'website/**'

# New pushes cancel stale in-progress PR runs instead of stacking them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trufflehog-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history for --since-commit to work

      - name: TruffleHog OSS scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified=false
        continue-on-error: true  # Always succeed, even if secrets found

      - name: Report scan status
        if: always()
        run: |
          echo "TruffleHog scan completed"
          echo "Check the logs above for any detected secrets"
